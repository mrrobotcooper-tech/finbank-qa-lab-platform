[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finbank"
version = "0.2.0"
description = "FinBank API — fictional digital banking System Under Test"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "redis>=5.2.1",
  "aio-pika>=9.5.4",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.1",
  "starlette>=0.41.3",
  "httpx>=0.28.1",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.10.1",
  "email-validator>=2.2.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.1",
  "ruff>=0.8.6",
  "mypy>=1.14.0",
  "types-redis>=4.6.0",
  "pip-audit>=2.7.3",
  "mutmut>=2.4.5",
  "allure-pytest>=2.13.5",
]

[project.scripts]
finbank-api = "finbank.main:run"
finbank-worker = "finbank.workers.main:run"
finbank-seed = "finbank.seed:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires running compose infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["finbank"]
mypy_path = "src"
warn_unused_ignores = true
