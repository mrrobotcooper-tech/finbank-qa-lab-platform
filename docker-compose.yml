name: finbank

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QA_READER_PASSWORD: ${QA_READER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_HOST_PORT:-25672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-25673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      PAYMENT_GATEWAY_URL: http://mocks:8090
      NOTIFICATION_GATEWAY_URL: http://mocks:8090
      APP_ENV: ${APP_ENV}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  mocks:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: ["uvicorn", "finbank.mocks.app:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "${MOCKS_HOST_PORT:-8090}:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: ["python", "-m", "finbank.workers"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      PAYMENT_GATEWAY_URL: http://mocks:8090
      NOTIFICATION_GATEWAY_URL: http://mocks:8090
      APP_ENV: ${APP_ENV}
    ports:
      - "${WORKER_HOST_PORT:-18001}:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy

  qa:
    profiles: ["qa"]
    build:
      context: ./qa
      dockerfile: Dockerfile
    environment:
      QA_BASE_URL: http://web
      QA_API_URL: http://api:8000
      QA_DATABASE_URL: postgresql://finbank_qa_reader:${QA_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QA_BROWSERS: ${QA_BROWSERS:-}
      CI: "1"
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - ./qa/reports:/qa/reports
    working_dir: /qa

  zap:
    profiles: ["zap"]
    image: ghcr.io/zaproxy/zaproxy:stable
    user: "0:0"
    entrypoint: ["zap-baseline.py"]
    command:
      - -t
      - http://web
      - -I
      - -m
      - "1"
      - -J
      - zap-baseline.json
      - -w
      - zap-baseline.md
      - -r
      - zap-baseline.html
    volumes:
      - ./qa/reports/zap:/zap/wrk
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
